name: release-gate

on:
  workflow_call:

jobs:
  release-gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: python-wheels-Linux-auto64
            wheel: "*-cp312-cp312-manylinux*x86_64.whl"
          - os: ubuntu-22.04-arm
            artifact: python-wheels-Linux-aarch64
            wheel: "*-cp312-cp312-manylinux*aarch64.whl"
          - os: macos-15
            artifact: python-wheels-macOS-arm64
            wheel: "*-cp312-cp312-macosx*arm64.whl"
          - os: windows-2022
            artifact: python-wheels-Windows-auto64
            wheel: "*-cp312-cp312-win_amd64.whl"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download candidate wheels
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: candidate-wheels

      - name: Run release gate
        shell: bash
        env:
          CT2_VERBOSE: "1"
          CANDIDATE_WHEEL_PATTERN: ${{ matrix.wheel }}
        run: >-
          python tools/release-gates/run_gate.py
          --candidate-wheel-pattern "candidate-wheels/$CANDIDATE_WHEEL_PATTERN"
          --limit 20 --bleu-limit 500 --device cpu

  release-gate-mps:
    # Keep CPU coverage; exercise the experimental MPS gate on manual runs first.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Verify Apple Silicon and Metal execution
        run: |
          test "$(uname -m)" = "arm64"
          swift python/tools/check_metal.swift

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download candidate wheels
        uses: actions/download-artifact@v8
        with:
          name: python-wheels-macOS-arm64
          path: candidate-wheels

      - name: Run MPS release gate
        shell: bash
        env:
          CT2_VERBOSE: "1"
        run: >-
          python tools/release-gates/run_gate.py
          --candidate-wheel-pattern "candidate-wheels/*-cp312-cp312-macosx*arm64.whl"
          --limit 20 --bleu-limit 500 --device mps
